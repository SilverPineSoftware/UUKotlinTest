name: Run Instrumented Tests

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Test configuration to run'
        required: true
        type: choice
        options:
          - quickGroup
          - ciGroup
          - completeGroup
          - pixel1api27
          - pixel2api28
          - pixel3api29
          - pixel4api30
          - pixel5api31
          - pixel6api32
          - pixel7api33
          - pixel8api34
          - pixel9api35
          - pixel10api36
          - nexus1api30
        default: 'quickGroup'

jobs:
  run-instrumented-tests:
    uses: SilverPineSoftware/UUGithubActions/.github/workflows/uu_android_instrumented_tests.yml@main
    with:
      configuration: ${{ inputs.configuration }}
      module_name: 'library_instrumented'
    secrets:
      READ_PACKAGES_PAT: ${{ secrets.CI_READ_PACKAGES_GITHUB_TOKEN }}
